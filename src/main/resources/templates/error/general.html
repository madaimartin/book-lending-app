<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::section},
          #{error.general.title}
      )}">

<section class="text-center">
    <h1 class="display-6 mb-3" th:text="#{error.general.title}">
        Something went wrong
    </h1>

    <p class="text-muted" th:text="#{error.general.message}">
        An unexpected error occurred.
    </p>

    <a th:href="@{/}" class="btn btn-dark mt-3"
       th:text="#{error.back.home}">
        Back to home
    </a>
</section>

</html>
