<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::section}, #{title.login})}">

<section>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h3 class="text-center mb-4" th:text="#{auth.login}">Login</h3>

            <div th:if="${param.error}" class="alert alert-danger mt-3">
                <span th:text="#{auth.invalid.credentials}">Invalid username or password</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success mt-3">
                <span th:text="#{auth.logged.out}">You have been logged out</span>
            </div>

            <div th:if="${param.registered}" class="alert alert-success mt-3">
                <span th:text="#{auth.register.success}">
                    Registration successful. You can now log in.
                </span>
            </div>

            <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
                <div class="mb-3">
                    <label class="form-label" th:text="#{user.label.username}">Username</label>
                    <input type="text" name="username" class="form-control"/>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{user.label.password}">Password</label>
                    <input type="password" name="password" class="form-control"/>
                </div>

                <button type="submit" class="btn btn-dark w-100" th:text="#{auth.login}">Login</button>
            </form>

            <div class="text-center mt-3">
                <span th:text="#{auth.no.account}">Don't have an account?</span>
                <a th:href="@{/register}" class="text-decoration-none fw-semibold" th:text="#{auth.register}">Register</a>
            </div>
        </div>
    </div>
</section>

</html>
