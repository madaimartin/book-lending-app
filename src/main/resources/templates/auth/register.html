<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::section}, #{auth.register})}">

<section>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h3 class="text-center mb-4" th:text="#{title.registration}">Register</h3>

            <form th:action="@{/register}" th:object="${userForm}" method="post" class="card card-body shadow-sm">

                <div class="mb-3">
                    <label class="form-label" th:text="#{user.label.username}">Username</label>
                    <input class="form-control"
                           th:field="*{username}"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{user.label.email}">Email</label>
                    <input class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{user.label.password}">Password</label>
                    <input type="password" class="form-control"
                           th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{user.label.phone}">Phone</label>
                    <input class="form-control"
                           th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <button type="submit" class="btn btn-dark w-100" th:text="#{auth.register}">Register</button>
            </form>

            <div class="text-center mt-3">
                <span th:text="#{auth.have.account}">Already have an account?</span>
                <a th:href="@{/login}" class="text-decoration-none fw-semibold" th:text="#{auth.login}">Login</a>
            </div>
        </div>
    </div>
</section>

</html>
