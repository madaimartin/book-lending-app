<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="adminLayout(content, pageTitle)">

<section>

    <div class="row">

        <!-- SIDEBAR -->
        <aside class="col-md-3 col-lg-2 border-end">

            <div class="list-group list-group-flush">

                <a th:href="@{/admin/dashboard}"
                   class="list-group-item list-group-item-action"
                   th:text="#{title.dashboard}">
                    Dashboard
                </a>

                <a th:href="@{/admin/users}"
                   class="list-group-item list-group-item-action"
                   th:text="#{title.admin.users}">
                    User Management
                </a>

                <a th:href="@{/books}"
                   class="list-group-item list-group-item-action"
                   th:text="#{title.admin.books}">
                    Books
                </a>

                <a th:href="@{/bookcopies}"
                   class="list-group-item list-group-item-action"
                   th:text="#{title.admin.bookcopies}">
                    Book Copies
                </a>

                <a th:href="@{/loans}"
                   class="list-group-item list-group-item-action"
                   th:text="#{title.admin.loans}">
                    Book Copies
                </a>

            </div>

        </aside>

        <!-- CONTENT -->
        <main class="col-md-9 col-lg-10 py-4 px-4">
            <div th:replace="${content}"></div>
        </main>

    </div>

</section>

</html>
