<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
            ~{::section},
            #{title.my.loans}
      )}">
<body>
<section class="container">

    <h3 class="mb-4" th:text="#{title.my.loans}">My Loans</h3>

    <div th:if="${flashMessage}"
         class="alert alert-success"
         th:text="#{${flashMessage}}"></div>

    <div th:if="${flashError}"
         class="alert alert-danger"
         th:text="#{${flashError}}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th th:text="#{book.label.title}">Title</th>
                    <th th:text="#{book.label.author}">Author</th>
                    <th th:text="#{copy.label.barcode}">Barcode</th>
                    <th th:text="#{loan.label.loanDate}">Loan date</th>
                    <th th:text="#{loan.label.dueDate}">Due date</th>
                    <th th:text="#{loan.label.returnDate}">Returned</th>
                    <th th:text="#{loan.label.status}">Status</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="l : ${loans}">
                    <td th:text="${l.title}"></td>
                    <td th:text="${l.author}"></td>
                    <td th:text="${l.barcode}"></td>

                    <td th:text="${#temporals.format(l.loanDate, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${#temporals.format(l.dueDate, 'yyyy-MM-dd')}"></td>

                    <td th:text="${l.returnDate != null
                        ? #temporals.format(l.returnDate, 'yyyy-MM-dd')
                        : '-'}"></td>

                    <td>
                        <span class="badge bg-success"
                              th:if="${l.status.name() == 'ACTIVE'}"
                              th:text="#{loan.status.ACTIVE}"></span>

                        <span class="badge bg-danger"
                              th:if="${l.status.name() == 'OVERDUE'}"
                              th:text="#{loan.status.OVERDUE}"></span>

                        <span class="badge bg-secondary"
                              th:if="${l.status.name() == 'RETURNED'}"
                              th:text="#{loan.status.RETURNED}"></span>
                    </td>

                    <td class="text-end">
                        <form th:if="${l.status.name() == 'ACTIVE'}"
                              th:action="@{/loans/{id}/extend(id=${l.loanId})}"
                              method="post">

                            <button class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-arrow-clockwise"></i>
                                <span th:text="#{action.extend}">Extend</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</section>
</body>
</html>
