<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
            ~{layout/admin-layout :: adminLayout(~{::section}, #{title.admin.users})},
            #{title.admin.users}
      )}">

<section>

    <h2 class="mb-4" th:text="#{title.admin.users}">Users</h2>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th th:text="#{user.label.username}">Username</th>
            <th th:text="#{user.label.email}">Email</th>
            <th th:text="#{user.label.role}">Role</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td class="text-end">
                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                   class="btn btn-sm btn-outline-dark"
                   th:text="#{action.edit}">
                    Edit
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</section>

</html>
